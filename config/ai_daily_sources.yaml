report:
  title: "Second Brain AI Daily"
  language: "zh-CN"
  timezone: "Asia/Tokyo"
  output_dir: "00_Inbox/AI-Daily"
  seen_file: "data/ai_daily_seen.json"

daily_limits:
  total_min: 5
  total_max: 15
  per_category_max: 3
  require_each_category: false
  allow_empty_category: true
  min_score: 75
  fallback:
    if_total_less_than: 5
    expand_time_window_days: 3

categories:
  agent:
    title: "Agent 进展"
    suggested_archive: "01_AI-Agent/"
    keywords:
      - "AI Agent"
      - "agent framework"
      - "autonomous agent"
      - "coding agent"
      - "browser agent"
      - "computer use"
      - "MCP agent"
      - "multi-agent"
      - "workflow agent"
      - "OpenClaw"
      - "Harness AI Code Agent"
      - "Claude Code"
      - "Codex"
      - "Devin"
      - "Jules"
      - "Manus"

  vibe_coding:
    title: "Vibe Coding"
    suggested_archive: "02_Vibe-Coding/"
    keywords:
      - "vibe coding"
      - "AI coding workflow"
      - "Cursor tutorial"
      - "Claude Code tutorial"
      - "Codex tutorial"
      - "Windsurf tutorial"
      - "Replit Agent"
      - "Lovable tutorial"
      - "Bolt.new tutorial"
      - "AI pair programming"
      - "prompt-driven development"
      - "spec-driven development"
      - "AI 编程"
      - "Cursor 教程"
      - "Claude Code 教程"

  prompt_engineering:
    title: "Prompt Engineering"
    suggested_archive: "03_Prompt-Engineering/"
    keywords:
      - "prompt engineering"
      - "prompt design"
      - "system prompt"
      - "context engineering"
      - "prompt template"
      - "structured prompting"
      - "few-shot prompting"
      - "eval prompt"
      - "提示词工程"
      - "系统提示词"
      - "结构化提示词"
      - "上下文工程"

  github_projects:
    title: "GitHub 热门 AI / Skills 项目"
    suggested_archive: "04_GitHub-Projects/"
    github_queries:
      - "topic:ai-agent stars:>=100 pushed:>=2026-01-01"
      - "topic:llm stars:>=300 pushed:>=2026-01-01"
      - "topic:rag stars:>=300 pushed:>=2026-01-01"
      - "topic:mcp stars:>=50 pushed:>=2026-01-01"
      - "prompt engineering stars:>=100 pushed:>=2026-01-01"
      - "AI coding agent stars:>=50 pushed:>=2026-01-01"
      - "agent skills stars:>=10 pushed:>=2026-01-01"
      - "MCP server stars:>=20 pushed:>=2026-01-01"
      - "AI skills stars:>=20 pushed:>=2026-01-01"

  model_news:
    title: "AI 大模型与多模态新闻"
    suggested_archive: "05_AI-News/"
    keywords:
      - "OpenAI"
      - "GPT"
      - "Claude"
      - "Anthropic"
      - "Gemini"
      - "Google DeepMind"
      - "DeepSeek"
      - "Qwen"
      - "Kimi"
      - "Doubao"
      - "GLM"
      - "Llama"
      - "Mistral"
      - "multimodal"
      - "vision language model"
      - "video generation"
      - "image generation"
      - "speech model"
      - "reasoning model"
      - "多模态"
      - "大模型"

sources:
  github:
    enabled: true
    per_query_limit: 10
    min_stars: 20
    pushed_within_days: 90
    sort: "updated"
    order: "desc"

  bilibili:
    enabled: true
    rsshub_base_url: "https://rsshub.app"
    per_keyword_limit: 5
    orders:
      - "pubdate"
      - "stow"
    keywords:
      - "AI Agent"
      - "智能体"
      - "Vibe Coding"
      - "Cursor 教程"
      - "Claude Code"
      - "Codex"
      - "提示词工程"
      - "大模型"
      - "多模态"
      - "MCP"
      - "RAG"
      - "DeepSeek"
      - "Qwen"

  rss:
    enabled: true
    feeds:
      - name: "OpenAI Blog"
        category: "model_news"
        url: "https://openai.com/news/rss.xml"
      - name: "Anthropic News"
        category: "model_news"
        url: "https://www.anthropic.com/news/rss.xml"
      - name: "Google DeepMind Blog"
        category: "model_news"
        url: "https://deepmind.google/discover/blog/rss.xml"
      - name: "Hugging Face Blog"
        category: "model_news"
        url: "https://huggingface.co/blog/feed.xml"
      - name: "LangChain Blog"
        category: "agent"
        url: "https://blog.langchain.com/rss/"
      - name: "LlamaIndex Blog"
        category: "agent"
        url: "https://www.llamaindex.ai/blog/rss.xml"

llm:
  enabled: true
  provider_env: "AI_DAILY_LLM_PROVIDER"
  default_provider: "none"
  max_input_items: 30
  fallback_without_llm: true
