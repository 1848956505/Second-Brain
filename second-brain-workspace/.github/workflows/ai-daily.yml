name: AI Daily Report

on:
  schedule:
    # 06:00 Beijing Time (UTC+8) = 22:00 UTC previous day
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ai-daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate AI daily report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          AI_DAILY_LLM_PROVIDER: ${{ vars.AI_DAILY_LLM_PROVIDER }}
        run: |
          python -m scripts.ai_daily.main

      - name: Commit report
        run: |
          git config user.name "ai-daily-bot"
          git config user.email "ai-daily-bot@users.noreply.github.com"
          git add 00_Inbox/AI-Daily data/ai_daily_seen.json
          git commit -m "chore: add AI daily report" || echo "No changes to commit"
          git push
